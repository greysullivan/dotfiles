# Independent of ~/.tmux.conf, which air-theme generates.
set -g default-shell /bin/zsh
set -g default-terminal tmux-256color
set -g prefix C-b
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys emacs
set -g mouse off
set -g set-clipboard off

# Keyboard-first controls, preserving the standard tmux bindings.
bind c new-window -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind r source-file ~/.config/tmux/console.conf \; display-message 'Console configuration reloaded'
bind -T copy-mode q send-keys -X cancel
bind -T copy-mode Space send-keys -X begin-selection
bind -T copy-mode Enter send-keys -X copy-selection-and-cancel

# Standard console colours and plain text; no special font required.
set -g status-style 'fg=white,bg=black'
setw -g window-status-style 'fg=white,bg=black'
setw -g window-status-current-style 'fg=black,bg=yellow,bold'
set -g pane-border-style 'fg=white'
set -g pane-active-border-style 'fg=yellow,bold'
set -g pane-border-lines simple
set -g message-style 'fg=black,bg=yellow'
setw -g mode-style 'fg=black,bg=yellow'
set -g status-left '[#S] '
set -g status-left-length 24
set -g status-right 'C-b ? help | %H:%M'
set -g status-right-length 24
setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#I:#W*'
