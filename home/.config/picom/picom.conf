# Sole compositor. Restrained transparency and shadows; no blur or animation.
backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.28;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'notification'"
];

fading = false;
corner-radius = 0;
active-opacity = 1.0;
inactive-opacity = 0.96;
frame-opacity = 1.0;

# Keep web content crisp; XFCE Terminal supplies its own subtle transparency.
opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Firefox'"
];
