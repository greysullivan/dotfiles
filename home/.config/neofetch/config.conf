# Grey's compact Arch fetch for Neowofetch.
print_info() {
    info title
    info underline

    info "OS" distro
    prin "Machine" "MacBook Air 13-inch (2017)"
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    prin "Session" "i3 / X11"
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    info "Disk" disk
    info "Battery" battery
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="off"
uptime_shorthand="tiny"
package_managers="on"
package_separate="off"
package_minimal="on"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_codename="off"
cpu_speed="off"
cpu_cores="logical"
cpu_temp="off"
memory_percent="on"
memory_report_available="on"
memory_unit="gib"
mem_precision=1
disk_show=('/')
disk_subtitle="none"
disk_percent="on"
battery_display="off"

# The terminal palette maps 5 to lavender and 7 to steel white.
colors=(5 5 5 5 5 7)
bold="on"
underline_enabled="on"
underline_char="─"
separator="  ›"

image_backend="ascii"
image_source="auto"
ascii_distro="arch_small"
ascii_colors=(5 5 7)
ascii_bold="on"
gap=3
stdout="off"
color_blocks="off"
