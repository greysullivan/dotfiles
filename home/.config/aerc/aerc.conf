[general]
log-level = error

[ui]
styleset-name = charcoal

[viewer]
alternatives = text/plain,text/html
pager = less -Rc

[compose]
editor = nvim

[filters]
text/plain = wrap -w 100 | colorize
text/html = /usr/lib/aerc/filters/html | colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize

[openers]
* = xdg-open {}

[hooks]
