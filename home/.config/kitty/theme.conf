# palette — unified system theme

# Font
font_family      JetBrains Mono
bold_font        JetBrains Mono
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 11.0

# Disable bold text brightening
disable_ligatures never

# Cursor (muted)
cursor #FF3D00
cursor_text_color background
cursor_shape block
cursor_blink_interval 0

# Background opacity
background_opacity 1.0

# Colors
foreground #FFFFFF
background #000000
selection_foreground #000000
selection_background #FF3D00

# Black
color0 #191919
color8 #A3A3A3

# Red (fault)
color1 #D88C8C
color9 #D88C8C

# Neutral information slot
color2 #FFFFFF
color10 #FFFFFF

# Neutral information slot
color3 #A3A3A3
color11 #A3A3A3

# Neutral information slot
color4 #D0D0D0
color12 #D0D0D0

# Neutral information slot
color5 #B8B8B8
color13 #B8B8B8

# Neutral information slot
color6 #C0C0C0
color14 #C0C0C0

# White (fg1 / fg0)
color7 #FFFFFF
color15 #FFFFFF

# Window borders
active_border_color #FF3D00
inactive_border_color #343434
bell_border_color #D88C8C

# Tab bar (minimal)
tab_bar_edge bottom
tab_bar_style fade
tab_fade 1
active_tab_foreground #000000
active_tab_background #FF3D00
inactive_tab_foreground #FFFFFF
inactive_tab_background #191919
