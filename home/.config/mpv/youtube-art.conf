# YouTube art playback: generated from ~/.config/air-theme/palette.json.
# Art settings apply only to YouTube URLs or an explicit --profile=youtube-art.
[youtube-art]
profile-desc=YouTube / 540 pixels high / 24 fps / normal speed
profile-cond=path and (path:match('^https?://youtube%.com/') or path:match('^https?://[%w%-]+%.youtube%.com/') or path:match('^https?://youtu%.be/') or path:match('^https?://[%w%-]+%.youtube%-nocookie%.com/'))
profile-restore=copy
ytdl-format=bestvideo[vcodec^=avc1][height<=720][fps<=?30]+bestaudio/bestvideo[height<=720][fps<=?30]+bestaudio/best[height<=720][fps<=?30]
ytdl-raw-options-append="js-runtimes=node"
ytdl-raw-options-append="no-playlist="
hwdec=auto-copy
vf=lavfi=[fps=24,scale=-2:540]
interpolation=no
speed=1
demuxer-max-bytes=32MiB
demuxer-max-back-bytes=8MiB
osd-font=DejaVu Sans
osd-color="#FFFFFF"
osd-selected-color="#FF3D00"
osd-outline-color="#000000"
osd-back-color="#000000"
osd-shadow-offset=0
osd-level=1
script-opts-append="osc-layout=bottombar"
script-opts-append="osc-seekbarstyle=bar"
script-opts-append="osc-boxalpha=0"
script-opts-append="osc-hidetimeout=1500"
script-opts-append="osc-fadeduration=0"
script-opts-append="osc-idlescreen=no"
script-opts-append="osc-windowcontrols=no"
script-opts-append="osc-background_color=#000000"
script-opts-append="osc-timecode_color=#FFFFFF"
script-opts-append="osc-title_color=#FFFFFF"
script-opts-append="osc-time_pos_color=#FFFFFF"
script-opts-append="osc-buttons_color=#FFFFFF"
script-opts-append="osc-small_buttonsL_color=#FFFFFF"
script-opts-append="osc-small_buttonsR_color=#FFFFFF"
script-opts-append="osc-top_buttons_color=#FFFFFF"
script-opts-append="osc-held_element_color=#FF3D00"
script-opts-append="osc-time_pos_outline_color=#000000"

# The small native script chooses VA-API scaling before decoding.
script-opts-append=youtube-art-enabled=yes
