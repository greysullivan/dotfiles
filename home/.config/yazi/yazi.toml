#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [ 1, 3, 4 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
scrolloff = 4

[preview]
wrap = "yes"
tab_size = 2
max_width = 900
max_height = 700
image_delay = 60
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1.0
ueberzug_offset = [ 0.0, 0.0, 0.0, 0.0 ]

[opener]
edit = [
    { run = '$EDITOR %s', block = true, desc = "$EDITOR", for = "unix" },
]
open = [
    { run = 'xdg-open %s1', orphan = true, desc = "Open", for = "linux" },
]
