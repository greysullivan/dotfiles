# ── Decoding ───────────────────────────────────────────────────────────────────
hwdec=auto-safe
vd-lavc-fast=yes

# ── YouTube quality ────────────────────────────────────────────────────────────
ytdl-format=bestvideo[height<=720][fps<=30]+bestaudio/best[height<=720]

# ── Cache ──────────────────────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=512MiB
demuxer-readahead-secs=20

# ── Quality of life ────────────────────────────────────────────────────────────
keep-open=yes
save-position-on-quit=yes

# ── Window — normal OS borders, auto-fit to content, no letterbox padding ──────
border=yes
autofit=x800
autofit-smaller=x800
keepaspect=yes
panscan=1.0

# ── Background — matches kitty/xfce4 theme, no black bars ─────────────────────
background-color=#171719

# ── Audio files — force window open and show embedded cover art ────────────────
force-window=yes
audio-display=embedded-first
image-display-duration=inf       # keep cover visible indefinitely when paused

# ── Window title ───────────────────────────────────────────────────────────────
title=${?media-title:${media-title}}${!media-title:${filename}} — mpv

# ── Scalers (fast/light — bilinear is cheap and clean enough for most content) ─
scale=bilinear
dscale=bilinear
cscale=bilinear

# ── Shaders — off by default, toggle with alt+f (fisheye) / alt+a (analog) ────

# ── Video sync ─────────────────────────────────────────────────────────────────
tscale=oversample

# ── Light profile — downscale heavy files on demand ────────────────────────────
# Usage: mpv --profile=light <file>
[light]
vf=scale=1280:-2
framedrop=vo
# vd-lavc-fast and hwdec already set globally
