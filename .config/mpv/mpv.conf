# mpv configuration for YouTube playback
# Created by playbook yt setup

# Hardware decoding (low CPU usage)
hwdec=auto-safe

# Default quality: 720p30 for low heat
ytdl-format=bestvideo[height<=720][fps<=30]+bestaudio/best[height<=720]

# Caching for smooth playback
cache=yes
demuxer-max-bytes=512MiB
demuxer-readahead-secs=20

# General quality of life
keep-open=yes
save-position-on-quit=yes

# Window appearance
border=no
