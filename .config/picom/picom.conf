#################################
#             Shadows           #
#################################
shadow = false;
shadow-radius = 0;
shadow-offset-x = 0;
shadow-offset-y = 0;

#################################
#           Fading              #
#################################
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.95;
active-opacity = 0.93;
frame-opacity = 0.93;

# Opacity rules for specific applications
opacity-rule = [
  "100:class_g = 'cineby-app'",
  "100:class_g = 'firefox'",
  "100:class_g = 'LMMS'",
  "100:class_g = 'mpv'",
  "100:class_g = 'steam'",
  "100:class_g = 'gimp'",
  "100:class_g = 'Gimp'",
  "100:class_g = 'Ulauncher'",
  "100:class_g = 'RetroArch'",
  "100:class_g = 'Spotify'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'Thunar'"
];

#################################
#           Corners             #
#################################
corner-radius = 0;

#################################
#            Blur               #
#################################
blur-kern = "3x3box";

#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# Exclude dock and desktop from rounded corners
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
