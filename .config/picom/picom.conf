#################################
#             Shadows           #
#################################
shadow = false;
shadow-radius = 0;
shadow-offset-x = 0;
shadow-offset-y = 0;

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.85;
active-opacity = 0.90;
frame-opacity = 0.9;

# Opacity rules for specific applications
opacity-rule = [
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'lmms'",
  "100:class_g = 'LMMS'",
  "100:class_g = 'retroarch'",
  "100:class_g = 'RetroArch'",
  "100:name *= 'cava-float'",
  "100:class_g = 'cava-float'",
  "100:class_g = 'Thunar'"
];

#################################
#           Corners             #
#################################
corner-radius = 0;

#################################
#            Blur               #
#################################
blur-kern = "3x3box";

#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# Exclude dock and desktop from rounded corners
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
