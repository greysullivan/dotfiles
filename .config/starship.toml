# Starship prompt - minimal and fast

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$status\
$character"""

add_newline = false

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #DDA0DD"

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "!"
ahead = "+"
behind = "-"
diverged = "+-"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "r"
deleted = "x"

[cmd_duration]
min_time = 800
format = "[$duration]($style) "
style = "bold yellow"

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"
