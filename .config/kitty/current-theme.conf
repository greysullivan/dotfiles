# palette — unified system theme
# bg0 #0f0f10 | bg1 #171719 | bg2 #1f1f22
# fg0 #e8e6df | fg1 #cfcac2 | muted #9d978f
# accent1 #c7b8ff | accent2 #a79bd9 | accent3 #7f76b3
# warn #d9a7a7 | good #b7c9b0 | info #c9c2a0

# Font
font_family      JetBrains Mono
bold_font        JetBrains Mono
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 11.0

# Disable bold text brightening
disable_ligatures never
bold_is_bright no

# Cursor (muted)
cursor #9d978f
cursor_text_color background
cursor_shape block
cursor_blink_interval 0

# Background opacity
background_opacity 0.90

# Colors
foreground #e8e6df
background #171719
selection_foreground #e8e6df
selection_background #1f1f22

# Black
color0 #1f1f22
color8 #9d978f

# Red (warn)
color1 #d9a7a7
color9 #e0b8b8

# Green (good)
color2 #b7c9b0
color10 #c6d9be

# Yellow (info)
color3 #c9c2a0
color11 #d6cfad

# Blue (accent3 / accent2)
color4 #7f76b3
color12 #a79bd9

# Magenta (accent1)
color5 #c7b8ff
color13 #d4c8ff

# Cyan (soft teal — nearest to info/good midpoint, no direct palette entry)
color6 #9db8b8
color14 #adc8c8

# White (fg1 / fg0)
color7 #cfcac2
color15 #e8e6df

# Window borders
active_border_color   #e8e6df
inactive_border_color #1f1f22
bell_border_color     #d9a7a7

# Tab bar (minimal)
tab_bar_edge bottom
tab_bar_style fade
tab_fade 1
active_tab_foreground   #e8e6df
active_tab_background   #7f76b3
inactive_tab_foreground #9d978f
inactive_tab_background #171719
