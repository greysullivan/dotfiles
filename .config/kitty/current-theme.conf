# white-steel terminal theme
# Soft white text on dark background with steel grey accents

# Font
font_family      JetBrains Mono
bold_font        JetBrains Mono
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 8.0

# Disable bold text brightening
disable_ligatures never
bold_is_bright no

# Cursor
cursor #A7ADB8
cursor_text_color background
cursor_shape block
cursor_blink_interval 0

# Background opacity
background_opacity 0.96

# Colors - white-steel palette
foreground #F5F7FA
background #1A1D23
selection_foreground #F5F7FA
selection_background #3D4451

# Black
color0 #2C2F38
color8 #4A4E5A

# Red (muted steel-red)
color1 #C8A7A7
color9 #D0B8B8

# Green (muted steel-green)
color2 #A7C8B8
color10 #B8D0C8

# Yellow (muted steel-yellow)
color3 #C8C0A7
color11 #D0CCB8

# Blue (steel blue)
color4 #A7B8C8
color12 #B8C8D0

# Magenta (steel magenta)
color5 #B8A7C8
color13 #C8B8D0

# Cyan (steel cyan)
color6 #A7C8C8
color14 #B8D0D0

# White (soft white to steel grey)
color7 #D0D5DD
color15 #F5F7FA

# Tab bar (minimal)
tab_bar_edge bottom
tab_bar_style fade
tab_fade 1
active_tab_foreground #F5F7FA
active_tab_background #3D4451
inactive_tab_foreground #A7ADB8
inactive_tab_background #252830
