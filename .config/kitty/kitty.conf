include current-theme.conf

# Enable remote control for dynamic transparency
allow_remote_control yes
listen_on unix:/tmp/kitty

# Remove padding and align content to top-left to avoid extra lines
window_padding_width 0 0 12 0
placement_strategy top-left
resize_in_steps yes

# Splits: alt+super+\ = vertical (side by side), alt+super+/ = horizontal (top/bottom)
map alt+super+backslash launch --location=vsplit
map alt+super+/ launch --location=hsplit

# Navigate between panes
map alt+super+h neighboring_window left
map alt+super+j neighboring_window down
map alt+super+k neighboring_window up
map alt+super+l neighboring_window right

# Image opacity and blur
background_opacity 0.90
background_blur 0
